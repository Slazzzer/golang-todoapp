basePath: /api/v1
definitions:
  github_com_Slazzzer_golang-todoapp_internal_core_transport_http_types.Nullable-bool:
    properties:
      set:
        type: boolean
      value:
        type: boolean
    type: object
  github_com_Slazzzer_golang-todoapp_internal_core_transport_http_types.Nullable-string:
    properties:
      set:
        type: boolean
      value:
        type: string
    type: object
  github_com_Slazzzer_golang-todoapp_internal_features_users_transport_http.UserDTOResponse:
    properties:
      full_name:
        description: Полное имя
        example: Иван Иванов
        type: string
      id:
        description: Идентификатор пользователя
        example: 1
        type: integer
      phone_number:
        description: Телефон или null
        example: "+79991234567"
        type: string
      version:
        description: Версия записи (для оптимистичной блокировки)
        example: 1
        type: integer
    type: object
  internal_core_transport_http_probes.ProbeStatusResponse:
    properties:
      status:
        description: 'Статус: ok, ready или not ready'
        example: ok
        type: string
    type: object
  internal_features_auth_transport_http.RegisterRequest:
    properties:
      full_name:
        description: Полное имя (3–100 символов)
        example: Иван Иванов
        maxLength: 100
        minLength: 3
        type: string
      phone_number:
        description: Телефон в формате +XXXXXXXXXXX (опционально)
        example: "+79991234567"
        maxLength: 15
        minLength: 10
        type: string
    required:
    - full_name
    type: object
  internal_features_auth_transport_http.RegisterResponse:
    properties:
      token:
        description: JWT-токен для последующих запросов
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      user:
        allOf:
        - $ref: '#/definitions/github_com_Slazzzer_golang-todoapp_internal_features_users_transport_http.UserDTOResponse'
        description: Созданный пользователь
    type: object
  internal_features_statistics_transport_http.GetStatisticsResponse:
    properties:
      task_completed_rate:
        description: Доля завершённых (0–1) или null
        example: 0.7
        type: number
      tasks_average_completion_time:
        description: Среднее время выполнения или null
        example: 24h30m15s
        type: string
      tasks_completed:
        description: Завершено задач за период
        example: 7
        type: integer
      tasks_created:
        description: Создано задач за период
        example: 10
        type: integer
    type: object
  internal_features_tasks_transport_http.CreateTaskRequest:
    properties:
      description:
        description: Описание (опционально)
        example: 2 литра
        maxLength: 1000
        minLength: 1
        type: string
      title:
        description: Заголовок (1–100 символов)
        example: Купить молоко
        maxLength: 100
        minLength: 1
        type: string
    required:
    - title
    type: object
  internal_features_tasks_transport_http.CreateTaskResponse:
    properties:
      author_user_id:
        description: ID автора (из JWT)
        example: 1
        type: integer
      completed:
        description: Выполнена ли задача
        example: false
        type: boolean
      completed_at:
        description: Дата завершения или null
        type: string
      created_at:
        description: Дата создания
        example: "2026-07-08T12:00:00Z"
        type: string
      description:
        description: Описание или null
        example: 2 литра
        type: string
      id:
        description: Идентификатор задачи
        example: 1
        type: integer
      title:
        description: Заголовок
        example: Купить молоко
        type: string
      version:
        description: Версия записи
        example: 1
        type: integer
    type: object
  internal_features_tasks_transport_http.GetTaskResponse:
    properties:
      author_user_id:
        description: ID автора (из JWT)
        example: 1
        type: integer
      completed:
        description: Выполнена ли задача
        example: false
        type: boolean
      completed_at:
        description: Дата завершения или null
        type: string
      created_at:
        description: Дата создания
        example: "2026-07-08T12:00:00Z"
        type: string
      description:
        description: Описание или null
        example: 2 литра
        type: string
      id:
        description: Идентификатор задачи
        example: 1
        type: integer
      title:
        description: Заголовок
        example: Купить молоко
        type: string
      version:
        description: Версия записи
        example: 1
        type: integer
    type: object
  internal_features_tasks_transport_http.PatchTaskRequest:
    properties:
      completed:
        allOf:
        - $ref: '#/definitions/github_com_Slazzzer_golang-todoapp_internal_core_transport_http_types.Nullable-bool'
        description: Статус выполнения (опционально)
      description:
        allOf:
        - $ref: '#/definitions/github_com_Slazzzer_golang-todoapp_internal_core_transport_http_types.Nullable-string'
        description: Новое описание (опционально)
      title:
        allOf:
        - $ref: '#/definitions/github_com_Slazzzer_golang-todoapp_internal_core_transport_http_types.Nullable-string'
        description: Новый заголовок (опционально)
    type: object
  internal_features_tasks_transport_http.PatchTaskUserResponse:
    properties:
      author_user_id:
        description: ID автора (из JWT)
        example: 1
        type: integer
      completed:
        description: Выполнена ли задача
        example: false
        type: boolean
      completed_at:
        description: Дата завершения или null
        type: string
      created_at:
        description: Дата создания
        example: "2026-07-08T12:00:00Z"
        type: string
      description:
        description: Описание или null
        example: 2 литра
        type: string
      id:
        description: Идентификатор задачи
        example: 1
        type: integer
      title:
        description: Заголовок
        example: Купить молоко
        type: string
      version:
        description: Версия записи
        example: 1
        type: integer
    type: object
  internal_features_tasks_transport_http.TaskDTOResponse:
    properties:
      author_user_id:
        description: ID автора (из JWT)
        example: 1
        type: integer
      completed:
        description: Выполнена ли задача
        example: false
        type: boolean
      completed_at:
        description: Дата завершения или null
        type: string
      created_at:
        description: Дата создания
        example: "2026-07-08T12:00:00Z"
        type: string
      description:
        description: Описание или null
        example: 2 литра
        type: string
      id:
        description: Идентификатор задачи
        example: 1
        type: integer
      title:
        description: Заголовок
        example: Купить молоко
        type: string
      version:
        description: Версия записи
        example: 1
        type: integer
    type: object
  internal_features_users_transport_http.GetUserResponse:
    properties:
      full_name:
        description: Полное имя
        example: Иван Иванов
        type: string
      id:
        description: Идентификатор пользователя
        example: 1
        type: integer
      phone_number:
        description: Телефон или null
        example: "+79991234567"
        type: string
      version:
        description: Версия записи (для оптимистичной блокировки)
        example: 1
        type: integer
    type: object
  internal_features_users_transport_http.PatchUserRequest:
    properties:
      full_name:
        allOf:
        - $ref: '#/definitions/github_com_Slazzzer_golang-todoapp_internal_core_transport_http_types.Nullable-string'
        description: Новое полное имя (опционально)
      phone_number:
        allOf:
        - $ref: '#/definitions/github_com_Slazzzer_golang-todoapp_internal_core_transport_http_types.Nullable-string'
        description: Новый телефон (опционально, null — удалить)
    type: object
  internal_features_users_transport_http.PatchUserResponse:
    properties:
      full_name:
        description: Полное имя
        example: Иван Иванов
        type: string
      id:
        description: Идентификатор пользователя
        example: 1
        type: integer
      phone_number:
        description: Телефон или null
        example: "+79991234567"
        type: string
      version:
        description: Версия записи (для оптимистичной блокировки)
        example: 1
        type: integer
    type: object
host: localhost:5050
info:
  contact: {}
  description: |-
    REST API для todo-приложения с JWT-авторизацией.
    Публичный маршрут: POST /auth/register. Все остальные эндпоинты /api/v1 требуют заголовок Authorization: Bearer &lt;token&gt;.
    Пользователь видит и изменяет только свои данные (профиль, задачи, статистику).
  title: Todoapp API
  version: "1.0"
paths:
  /auth/me:
    get:
      description: Возвращает профиль пользователя из JWT-токена. Удобная альтернатива
        GET /users/{id}, когда id неизвестен.
      produces:
      - application/json
      responses:
        "200":
          description: Профиль текущего пользователя
          schema:
            $ref: '#/definitions/github_com_Slazzzer_golang-todoapp_internal_features_users_transport_http.UserDTOResponse'
        "401":
          description: Токен отсутствует или невалиден
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Текущий пользователь
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Публичный эндпоинт. Создаёт пользователя и возвращает JWT-токен
        (срок жизни задаётся JWT_TTL, по умолчанию 30 дней). Пароль не требуется.
      parameters:
      - description: Данные для регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth_transport_http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь создан, токен выдан
          schema:
            $ref: '#/definitions/internal_features_auth_transport_http.RegisterResponse'
        "400":
          description: Невалидные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Превышен лимит регистраций с одного IP
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация пользователя
      tags:
      - auth
  /health:
    get:
      description: Возвращает ok, если HTTP-сервер запущен. Не требует авторизации.
      produces:
      - application/json
      responses:
        "200":
          description: Сервер работает
          schema:
            $ref: '#/definitions/internal_core_transport_http_probes.ProbeStatusResponse'
      summary: Проверка живости
      tags:
      - probes
  /ready:
    get:
      description: Возвращает ready, если PostgreSQL доступен. Не требует авторизации.
      produces:
      - application/json
      responses:
        "200":
          description: Приложение готово принимать запросы
          schema:
            $ref: '#/definitions/internal_core_transport_http_probes.ProbeStatusResponse'
        "503":
          description: База данных недоступна
          schema:
            $ref: '#/definitions/internal_core_transport_http_probes.ProbeStatusResponse'
      summary: Проверка готовности
      tags:
      - probes
  /statistics:
    get:
      description: Агрегированная статистика по задачам авторизованного пользователя.
        Параметр user_id опционален и должен совпадать с id из JWT.
      parameters:
      - description: ID пользователя (должен совпадать с токеном)
        in: query
        name: user_id
        type: integer
      - description: Начало периода (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Конец периода (YYYY-MM-DD, не включая этот день)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Статистика
          schema:
            $ref: '#/definitions/internal_features_statistics_transport_http.GetStatisticsResponse'
        "400":
          description: Невалидный период или параметры
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Запрос статистики другого пользователя запрещён
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Статистика
      tags:
      - statistics
  /tasks:
    get:
      description: Возвращает только задачи авторизованного пользователя. Поддерживает
        пагинацию limit/offset (по умолчанию limit=50, max=100).
      parameters:
      - description: Размер страницы
        in: query
        name: limit
        type: integer
      - description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Список задач
          schema:
            items:
              $ref: '#/definitions/internal_features_tasks_transport_http.TaskDTOResponse'
            type: array
        "401":
          description: Не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Список задач
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: author_user_id берётся из JWT автоматически, передавать в JSON
        не нужно.
      parameters:
      - description: Данные новой задачи
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Задача создана
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskResponse'
        "400":
          description: Невалидные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Создать задачу
      tags:
      - tasks
  /tasks/{id}:
    delete:
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Задача удалена
        "401":
          description: Не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ к чужой задаче запрещён
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Удалить задачу
      tags:
      - tasks
    get:
      description: Доступ только к своим задачам. Чужая задача — 403.
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Данные задачи
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.GetTaskResponse'
        "401":
          description: Не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ к чужой задаче запрещён
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Задача не найдена
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить задачу
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: Частичное обновление. При completed=true автоматически проставляется
        completed_at.
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      - description: Поля для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Обновлённая задача
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskUserResponse'
        "400":
          description: Невалидные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ к чужой задаче запрещён
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Изменить задачу
      tags:
      - tasks
  /users/{id}:
    delete:
      description: Удаление своего аккаунта. Если есть связанные задачи, может вернуться
        409.
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Пользователь удалён
        "401":
          description: Не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ к чужому профилю запрещён
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Конфликт (например, есть связанные данные)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Удалить пользователя
      tags:
      - users
    get:
      description: Доступ только к своему id. Запрос чужого id вернёт 403.
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Данные пользователя
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.GetUserResponse'
        "401":
          description: Не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ к чужому профилю запрещён
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Пользователь не найден
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить пользователя
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Частичное обновление профиля. Доступ только к своему id.
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      - description: Поля для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_users_transport_http.PatchUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Обновлённый профиль
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.PatchUserResponse'
        "400":
          description: Невалидные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ к чужому профилю запрещён
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Изменить пользователя
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: 'JWT-токен. Формат: Bearer &lt;token&gt;. Токен выдаётся при регистрации
      (POST /auth/register).'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
